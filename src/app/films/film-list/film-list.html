
<main class="container py-5">

  <h1 class="mb-4">Films à l'affiche</h1>

  @if (films().length === 0) {

    <p class="text-muted">
      Aucun film disponible.
    </p>

  } @else {

    <div class="row g-4">

      @for (film of films(); track film.idFilm) {

        <div class="col-12 col-md-6 col-lg-4">

          <article class="card h-100 shadow-sm">

            <img
              [src]="film.urlAffiche"
              [alt]="'Affiche du film ' + film.titre"
              class="card-img-top film-affiche"
            >

            <div class="card-body d-flex flex-column">

              <h2 class="card-title h5">
                {{ film.titre }}
              </h2>

              <p class="card-text text-muted">
                {{ film.genre }} —
                {{ film.dureeMinute }} min
              </p>

              <p class="card-text">
                Réalisé par {{ film.realisateur }}
              </p>

              <a
                [routerLink]="['/films', film.idFilm]"
                class="btn btn-primary mt-auto"
              >
                Voir les séances
              </a>

            </div>

          </article>

        </div>

      }

    </div>

  }

</main>
