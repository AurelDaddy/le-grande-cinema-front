<header>
  <nav>

    <a routerLink="/">
      Le Grande Cinema
    </a>

    <a routerLink="/">
      Films
    </a>

    @if (
    authService.utilisateurConnecte()?.typeUtilisateur === 'ADMIN' //si utilisateur existe alors lis typeUtillisateur
    ) {
    <a routerLink="/admin">
      Administration
    </a>
    }

    @if (authService.utilisateurConnecte(); as utilisateur) {

    <span>
      Bonjour {{ utilisateur.prenom }}
    </span>

    <button type="button" (click)="deconnecter()">
      Déconnexion
    </button>

    } @else {

    <a routerLink="/login">
      Connexion
    </a>

    <a routerLink="/register">
      Inscription
    </a>

    }

  </nav>
</header>
